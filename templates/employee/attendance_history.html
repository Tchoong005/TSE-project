<div class="table-box">
    <h2>My Attendance History</h2>

    <table>
        <tr>
            <th>Date</th>
            <th>Check In</th>
            <th>Check Out</th>
            <th>Status</th>
            <th>Overtime</th>
        </tr>

        {% for record in records %}
        <tr>
            <td>{{ record.date }}</td>
            <td>{{ record.check_in }}</td>
            <td>{{ record.check_out }}</td>
            <td>{{ record.status }}</td>
            <td>{{ record.overtime or "No" }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
