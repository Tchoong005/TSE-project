<!DOCTYPE html>
<html>
<head>
    <title>Edit Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

{% include "shared/toast.html" %}

<div class="layout">
    {% include "shared/sidebar.html" %}

    <div class="main">
        <div class="header">
            <h1>Edit Attendance Record</h1>
            <p>Correct attendance records when system errors occur.</p>
        </div>

        <div class="form-box">
            <p><strong>Employee:</strong> {{ record.full_name }}</p>
            <p><strong>Date:</strong> {{ record.date }}</p>

            <form method="POST">
                <label>Check In</label>
                <input type="time" name="check_in" value="{{ record.check_in or '' }}" step="1">

                <label>Check Out</label>
                <input type="time" name="check_out" value="{{ record.check_out or '' }}" step="1">

                <label>Status</label>
                <select name="status">
                    <option value="Present" {% if record.status == "Present" %}selected{% endif %}>Present</option>
                    <option value="Late" {% if record.status == "Late" %}selected{% endif %}>Late</option>
                    <option value="Absent" {% if record.status == "Absent" %}selected{% endif %}>Absent</option>
                </select>

                <label>Edit Reason</label>
                <select name="reason" required>
                    <option value="" disabled {% if not record.edit_reason %}selected{% endif %}>Select a reason</option>
                    {% for reason in edit_reasons %}
                    <option value="{{ reason }}" {% if record.edit_reason == reason %}selected{% endif %}>{{ reason }}</option>
                    {% endfor %}
                </select>

                <button type="submit">Update Attendance</button>
                <a class="btn btn-danger" href="/attendance_records">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
