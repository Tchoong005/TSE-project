<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - EAS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

{% include "shared/toast.html" %}

<main class="auth-shell auth-shell-compact">
    <section class="auth-hero">
        <div class="auth-logo-block auth-logo-block-small">
            <img src="{{ url_for('static', filename='images/bilobali_logo.png') }}" alt="Bilobali logo">
            <div>
                <strong>EAS</strong>
                <span>Employee Attendance System</span>
            </div>
        </div>
        <div>
            <h1>Password Recovery</h1>
            <p>Enter your registered email. After OTP verification, you can set a new password.</p>
        </div>
        <div class="auth-points">
            <span>Gmail OTP</span>
            <span>5 Minutes</span>
            <span>Secure Reset</span>
        </div>
    </section>

    <section class="auth-panel">
        <h2>Verify Email</h2>
        <p>Use the email connected to your employee account.</p>

        <form method="POST">
            <input type="email" name="email" placeholder="Registered Email" data-email-check required>
            <p id="emailMessage" class="field-error"></p>
            <button type="submit">Send OTP</button>
        </form>

        <a class="btn auth-kiosk-link" href="/login">Back to Login</a>
    </section>
</main>

<script src="{{ url_for('static', filename='js/account_form.js') }}"></script>
<script>
    initAccountForm();
</script>

</body>
</html>
