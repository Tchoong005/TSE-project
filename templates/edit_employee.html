<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <h2>EAS System</h2>
        <a href="/superadmin">Dashboard</a>
        <a href="/employees">Manage Employees</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="main">
        <div class="header">
            <h1>Edit Employee</h1>
            <p>Update employee information and role assignment.</p>
        </div>

        <div class="form-box">
            <form method="POST">
                <input type="text" name="username" value="{{ user.username }}" required>
                <input type="text" name="full_name" value="{{ user.full_name }}" required>
                <input type="email" name="email" value="{{ user.email }}" required>
                <input type="text" name="department" value="{{ user.department }}" required>
                <input type="text" name="position" value="{{ user.position }}" required>

                <select name="role" required>
                    <option value="hr" {% if user.role == "hr" %}selected{% endif %}>HR Management</option>
                    <option value="employee" {% if user.role == "employee" %}selected{% endif %}>Employee</option>
                </select>

                <select name="status" required>
                    <option value="Active" {% if user.status == "Active" %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if user.status == "Inactive" %}selected{% endif %}>Inactive</option>
                </select>

                <button type="submit">Update Employee</button>
                <a class="btn btn-danger" href="/employees">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
